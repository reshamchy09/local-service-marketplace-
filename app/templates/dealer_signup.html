{% extends "base.html" %}

{% block content %}

<div style="max-width:500px; margin:40px auto; background:white; padding:25px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.1);">

    <h2 style="text-align:center; margin-bottom:20px;">Dealer Registration</h2>

    <form method="post">
        {% csrf_token %}

        <input type="text" name="full_name" placeholder="Full Name" required
            style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px;">

        <input type="email" name="email" placeholder="Email" required
            style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px;">

        <input type="tel" name="phone" placeholder="Phone Number" required
            style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px;">

        <input type="text" name="business_name" placeholder="Business Name" required
            style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:8px;">

        <input type="password" name="password" placeholder="Password" required
            style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ddd; border-radius:8px;">

        <button type="submit"
            style="width:100%; padding:12px; background:#28a745; color:white; border:none; border-radius:8px; cursor:pointer;">
            Register as Dealer
        </button>

    </form>

</div>

{% endblock %}
