{% extends "base/base.html" %}

{% block content %}

<style>
    .form-container {
        max-width: 600px;
        margin: 40px auto;
        padding: 25px;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    .form-title {
        text-align: center;
        margin-bottom: 20px;
        font-size: 22px;
        font-weight: bold;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #333;
    }

    input, textarea, select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: 0.2s;
        background: #fafafa;
    }

    input:focus, textarea:focus {
        border-color: #007bff;
        background: #fff;
        box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
    }

    textarea {
        resize: vertical;
        min-height: 100px;
    }

    .note {
        font-size: 12px;
        color: #777;
        margin-bottom: 15px;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #007bff, #0056b3);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .btn-submit:hover {
        transform: translateY(-1px);
        background: linear-gradient(135deg, #0056b3, #003f7f);
    }
</style>

<div class="form-container">

    <div class="form-title">Create New Work Post</div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label>Title</label>
            {{ form.title }}
        </div>

        <div class="form-group">
            <label>Description</label>
            {{ form.description }}
        </div>

        <div class="form-group">
            <label>Address</label>
            {{ form.address }}
        </div>

        <div class="form-group">
            <label>Upload Image</label>
            {{ form.image }}
        </div>

        <div class="form-group">
            <label>Upload Video</label>
            {{ form.video }}
        </div>

        <div class="note">
            ⚠ Upload only ONE file (image or video). Max size: 10MB
        </div>

        <button type="submit" class="btn-submit">
            Submit Post
        </button>

    </form>

</div>

{% endblock %}
